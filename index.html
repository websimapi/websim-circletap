<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Circle Tap Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-container">
            <div id="score-display" class="hidden">Score: <span id="score">0</span></div>
            
            <div id="start-menu">
                <h1>Circle Tap</h1>
                <p>Tap when the line is in the green zone.</p>
                <div id="difficulty-selection">
                    <button class="difficulty-btn" data-difficulty="easy">Easy</button>
                    <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                    <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                </div>
            </div>

            <div id="game-over-menu" class="hidden">
                <h2>Game Over</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <div id="game-over-buttons">
                    <button id="replay-btn">Watch Replay</button>
                    <button id="share-replay-btn" aria-label="Share Replay">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    </button>
                    <button id="restart-btn">Try Again</button>
                </div>
            </div>
        </div>
    </div>
    <div id="replay-container" class="hidden">
        <button id="post-replay-comment-btn" class="hidden">Post to Comments</button>
        <button id="close-replay-btn" aria-label="Close replay">&times;</button>
        <div id="player-root"></div>
    </div>
